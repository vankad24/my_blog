services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myblog
      POSTGRES_USER: myblog
      POSTGRES_PASSWORD: myblog_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myblog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django backend
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: myblog
      DB_USER: myblog
      DB_PASSWORD: myblog_secret
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - staticfiles:/app/staticfiles

  # Vue frontend (built, served by nginx)
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["prod"]

volumes:
  pgdata:
  staticfiles: